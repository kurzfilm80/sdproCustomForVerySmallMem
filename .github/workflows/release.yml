name: Build release firmware

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      skip_firmware: true
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19 zopfli==0.4.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firmware/web/package-lock.json

      - name: Install web dependencies
        run: |
          npm ci --prefix firmware/web
          npm ci --prefix integration/card

      - name: Build SD PRO firmware
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          FIRMWARE_NAME="SDP-HomeAssistant-MiniDisplay-${VERSION}.bin"
          make PIO=pio FIRMWARE_VERSION="${VERSION}" build
          mkdir -p dist
          cp firmware/.pio/build/sdpro/firmware.bin "dist/${FIRMWARE_NAME}"

          FIRMWARE_SHA256="$(sha256sum "dist/${FIRMWARE_NAME}" | cut -d' ' -f1)"
          make PIO=pio bootstrap-build \
            BOOTSTRAP_VERSION="${VERSION}" \
            BOOTSTRAP_SHA256="${FIRMWARE_SHA256}"
          cp firmware-bootstrap/.pio/build/sdpro_bootstrap/firmware.bin \
            "dist/SDP-HomeAssistant-MiniDisplay-Bootstrap-${VERSION}.bin"

          # Other display profiles are not supported yet. Keep their release
          # builds disabled until their hardware support is ready.
          # make PIO=pio build-all

      - name: Run native regression tests before publishing
        run: make test-native

      - name: Package build sources and dependency licenses
        run: python firmware/scripts/package_release_sources.py

      - name: Store build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-assistant-mini-display-${{ github.ref_name }}
          path: |
            dist/*.bin
            dist/release-sources.tar.gz
            THIRD_PARTY.md
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            dist/*.bin
            dist/release-sources.tar.gz
            THIRD_PARTY.md
