name: Hassfest

on:
  pull_request:
    paths: &hassfest-paths
      - 'custom_components/**'
      - '.github/workflows/hassfest.yml'
  push:
    branches: [master]
    paths: *hassfest-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93
