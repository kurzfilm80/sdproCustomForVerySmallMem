version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /firmware/web
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      firmware-web:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /integration/card
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      integration-card:
        patterns:
          - "*"
